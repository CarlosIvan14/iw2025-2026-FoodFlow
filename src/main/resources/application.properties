# ==========================================
# HTTPS Configuration - Desarrollo Local
# ==========================================
# Certificado autofirmado para desarrollo
# En PRODUCCIÓN: Usar certificado real (Let's Encrypt, AWS Certificate Manager, etc.)
server.port=${PORT:8443}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=tomcat

# NOTAS PARA DEPLOY A PRODUCCIÓN:
# 1. Generar certificado real con Let's Encrypt:
#    - Usar certbot: certbot certonly --standalone -d tudominio.com
#    - Convertir a PKCS12: openssl pkcs12 -export -in cert.pem -inkey key.pem -out keystore.p12
# 2. Guardar keystore en volumen seguro (no en git)
# 3. Usar variables de entorno para contraseña: ${KEYSTORE_PASSWORD}
# 4. Redirigir HTTP a HTTPS en nginx/reverse proxy
# 5. Habilitar HSTS (Strict-Transport-Security header)
# 6. Para BD MySQL en producción: cambiar a useSSL=true si el servidor lo soporta
server.http2.enabled=true
server.ssl.enabled=true

spring.main.web-application-type=servlet
logging.level.org.atmosphere=warn

spring.config.import=optional:classpath:secrets.properties

spring.datasource.url=jdbc:mysql://localhost:3306/pos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

vaadin.allowed-packages=com.yourapp.pos
vaadin.productionMode=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pricedrop2023@gmail.com
spring.mail.password=omhp qeyt vmdg gshr
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# AWS S3 Configuration (del .env)
