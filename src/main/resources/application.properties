spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# AWS S3 Configuration (del .env)
# ==========================================
app.aws.access-key-id=${AWS_ACCESS_KEY_ID:}
app.aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
app.aws.region=${AWS_REGION:eu-north-1}
app.aws.s3.bucket-name=${S3_BUCKET_NAME:}
app.aws.s3.products-prefix=${S3_PRODUCTS_PREFIX:products/}


# ==========================================
# Upload local (fallback si S3 no funciona)
# ==========================================
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.url=${APP_UPLOAD_URL:/uploads}
